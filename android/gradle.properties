org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation (avoids "Could not close incremental caches" on Windows)
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# Flutter's Gradle plugin otherwise replaces app-provided ABI filters with
# its default platform list. The Go JNI backend is arm64-only, so preserve the
# explicit arm64-v8a filter declared in app/build.gradle.kts.
disable-abi-filtering=true

# 本地构建：关掉 Gradle 内置的 SDK 自动安装。它在弱网下会静默挂住，
# 缺少的包改用 cmdline-tools 的 sdkmanager 手动装（会直接报错而非卡死）。
android.builder.sdkDownload=false
